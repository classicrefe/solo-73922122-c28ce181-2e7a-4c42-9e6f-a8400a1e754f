<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}水位时长核算{% endblock %}</title>
  <style>
    body { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #14506b; color: #fff; padding: 14px 28px; }
    header h1 { margin: 0; font-size: 20px; }
    nav { margin-top: 8px; }
    nav a { color: #cfe6f2; margin-right: 18px; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; text-decoration: underline; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 8px; padding: 20px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #d9e0e6; padding: 7px 10px; text-align: right; }
    th { background: #eef3f6; }
    td:first-child, th:first-child { text-align: left; }
    label { display: block; margin: 10px 0 4px; font-size: 14px; }
    input[type=text], input[type=date], input[type=number] {
      padding: 7px 9px; border: 1px solid #b7c2cc; border-radius: 5px;
      min-width: 220px; font-size: 14px; }
    input[type=file] { font-size: 14px; }
    button { background: #14506b; color: #fff; border: 0; border-radius: 5px;
             padding: 9px 22px; font-size: 14px; cursor: pointer; margin-top: 14px; }
    button:hover { background: #0d3a50; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
    .flash.error { background: #fde8e8; border: 1px solid #f2b8b5; color: #8a1f17; }
    .flash.ok { background: #e6f6ec; border: 1px solid #a9dcbd; color: #1d6b39; }
    .muted { color: #667; font-size: 13px; }
    .kpi { display: inline-block; background: #eef3f6; border-radius: 6px;
           padding: 12px 18px; margin-right: 12px; min-width: 150px; }
    .kpi b { display: block; font-size: 20px; margin-top: 4px; }
    code { background: #eef3f6; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
<header>
  <h1>水位时长核算系统（UTC · 整数毫米 · 逐日摘要）</h1>
  <nav>
    <a href="{{ url_for('web.index') }}">首页 / 站点概览</a>
    <a href="{{ url_for('web.import_page') }}">导入观测 CSV</a>
    <a href="{{ url_for('web.query_page') }}">警戒线核算查询</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
