services:
  web:
    build: .
    image: waterlevel-accounting:latest
    container_name: waterlevel-web
    ports:
      - "8000:8000"
    volumes:
      - waterlevel-data:/data
    environment:
      WATERLEVEL_DB: /data/waterlevel.db
      SECRET_KEY: change-me-in-production
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  waterlevel-data:
